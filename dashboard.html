<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Crypto Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    body {
      margin: 0;
      background-color: #0d0d0d;
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
      overflow-x: hidden;
    }

    nav {
      background-color: #111;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: bold;
      color: #ffcc00;
    }

    .hero {
      background: linear-gradient(to right, #1e1e1e, #2c003e);
      padding: 80px 20px;
      text-align: center;
      color: #fff;
    }

    .hero h1 {
      font-size: 2.5rem;
      font-weight: 700;
      color: #ffcc00;
      animation: glow 2s ease-in-out infinite alternate;
    }

    .hero p {
      font-size: 1.1rem;
      color: #ccc;
    }

    @keyframes glow {
      from {
        text-shadow: 0 0 10px #ffcc00, 0 0 20px #ffcc00;
      }
      to {
        text-shadow: 0 0 20px #ffaa00, 0 0 40px #ffaa00;
      }
    }

    .coin-scroll {
      display: flex;
      overflow-x: auto;
      padding: 20px;
      gap: 20px;
      scroll-snap-type: x mandatory;
    }

    .coin-card {
      min-width: 250px;
      background-color: #1a1a1a;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 0 20px rgba(255, 204, 0, 0.1);
      scroll-snap-align: start;
      flex-shrink: 0;
    }

    .coin-card h4 {
      color: #ffcc00;
    }

    .footer {
      background-color: #000;
      padding: 20px;
      color: #aaa;
      text-align: center;
    }

    .logout-btn {
      background-color: #ff4d4d;
      border: none;
      padding: 10px 20px;
      color: white;
      border-radius: 5px;
    }

    .logout-btn:hover {
      background-color: #cc0000;
    }
  </style>
</head>
<body>
  <nav>
    <div class="logo">CryptoDash</div>
    <button class="logout-btn" onclick="logout()">Logout</button>
  </nav>

  <div class="hero">
    <h1><i class="fa-regular fa-circle-user"></i> Welcome, <span id="displayName">User</span></h1>
    <p>Track your favorite cryptocurrencies in real time</p>
  </div>

  <div class="container mt-5">
    <h3 class="text-warning mb-3">Top Coins</h3>
    <div class="coin-scroll" id="coinCards">
      <div class="coin-card">
        <h4><i class="fa-brands fa-bitcoin"></i> Bitcoin (BTC)</h4>
        <p>Loading...</p>
      </div>
      <div class="coin-card">
        <h4><i class="fa-brands fa-ethereum"></i> Ethereum (ETH)</h4>
        <p>Loading...</p>
      </div>
      <div class="coin-card">
        <h4><i class="fa-solid fa-coins"></i> Solana (SOL)</h4>
        <p>Loading...</p>
      </div>
    </div>
  </div>

  <div class="footer">
    <p>&copy; 2025 CryptoDash. All rights reserved.</p>
  </div>

  <script>
    const name = JSON.parse(sessionStorage.getItem("user"));
    if (!name) {
      window.location.href = "login.html";
    } else {
      document.getElementById("displayName").textContent = name.name;
    }

    function logout() {
      sessionStorage.clear();
      window.location.href = "login.html";
    }

    // Fetch live prices from CoinGecko
    fetch("https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum,solana&vs_currencies=usd")
      .then(res => res.json())
      .then(data => {
        const cards = document.querySelectorAll(".coin-card");
        cards[0].querySelector("p").textContent = `Price: $${data.bitcoin.usd}`;
        cards[1].querySelector("p").textContent = `Price: $${data.ethereum.usd}`;
        cards[2].querySelector("p").textContent = `Price: $${data.solana.usd}`;
      });
  </script>
</body>
</html>
