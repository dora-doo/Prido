<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login</title>
  <link rel="stylesheet" href="style.css" />
  <style>
  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
</style>
</head>
<body class="auth-page" style="background-image: url('https://source.unsplash.com/1600x900/?technology');">
  <div class="auth-container">
    <h2>Login</h2>
    <form onsubmit="loginUser(event)">
      <label for="email">Email</label>
      <input type="email" id="email" required />

      <label for="password">Password</label>
      <input type="password" id="password" required />

      <button type="submit">Login</button>
      <p><a href="forgot-password.html">Forgot Password?</a></p>
    </form>
    <div id="loading" style="display: none; margin-top: 20px; text-align: center;">
  <p style="color: white;">Redirecting to dashboard...</p>
  <div class="spinner" style="border: 4px solid #f3f3f3; border-top: 4px solid #ffcc00; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: auto;"></div>
</div>
    <p id="loginMsg"></p>
  </div>

  <script>
    function loginUser(event) {
      event.preventDefault();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();
      const msg = document.getElementById("loginMsg");

      const userData = JSON.parse(localStorage.getItem(email));
      if (userData && userData.password === password) {
        sessionStorage.setItem("user", JSON.stringify(userData));
        msg.innerText = "Login successful!";
        msg.style.color = "green";
        loading.style.display="block";
        setTimeout(() => window.location.href = "dashboard.html", 2000);
      } else {
        msg.innerText = "Invalid credentials.";
        msg.style.color = "red";
      }
    }
  </script>
</body>
</html>
